<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; background: #111; color: #eee;
         font-family: system-ui, sans-serif; }
  html, body { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  canvas { background: #000; border: 2px solid #444; width: min(92vw, 400px); height: auto;
           touch-action: none; }
  p { margin: 8px; text-align: center; }
  #pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px);
         gap: 6px; margin-top: 12px; }
  #pad button { font-size: 28px; border: none; border-radius: 12px; background: #333; color: #eee;
                touch-action: none; -webkit-tap-highlight-color: transparent; }
  #pad button:active { background: #555; }
  #up { grid-column: 2; grid-row: 1; } #left { grid-column: 1; grid-row: 2; }
  #restart { grid-column: 2; grid-row: 2; font-size: 22px !important; }
  #right { grid-column: 3; grid-row: 2; } #down { grid-column: 2; grid-row: 3; }
  #tilt { margin-top: 12px; padding: 10px 18px; font-size: 16px; border: none; border-radius: 10px;
          background: #333; color: #eee; -webkit-tap-highlight-color: transparent; }
  #tilt.on { background: #2a6; }
</style>
</head>
<body>
<p>Score: <span id="score">0</span></p>
<canvas id="game" width="400" height="400"></canvas>
<div id="pad">
  <button id="up" data-dir="up" aria-label="Up">▲</button>
  <button id="left" data-dir="left" aria-label="Left">◀</button>
  <button id="restart" aria-label="Restart">↻</button>
  <button id="right" data-dir="right" aria-label="Right">▶</button>
  <button id="down" data-dir="down" aria-label="Down">▼</button>
</div>
<button id="tilt">Tilt control: Off</button>
<p>Arrow keys / WASD / swipe / buttons / tilt to move · Space or tap to restart</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const SIZE = 20, CELLS = canvas.width / SIZE;

let snake, dir, nextDir, food, score, over;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = nextDir = {x: 1, y: 0};
  score = 0; over = false;
  scoreEl.textContent = score;
  placeFood();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  if (over) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) { over = true; return; }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++; scoreEl.textContent = score; placeFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e33';
  ctx.fillRect(food.x * SIZE, food.y * SIZE, SIZE - 1, SIZE - 1);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#7f7' : '#3c3';
    ctx.fillRect(s.x * SIZE, s.y * SIZE, SIZE - 1, SIZE - 1);
  });
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '28px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
    ctx.font = '16px system-ui';
    ctx.fillText('Press Space or tap to restart', canvas.width / 2, canvas.height / 2 + 30);
  }
}

const DIRS = {
  up: {x: 0, y: -1}, down: {x: 0, y: 1}, left: {x: -1, y: 0}, right: {x: 1, y: 0},
};
const KEYS = {
  ArrowUp: DIRS.up, w: DIRS.up, ArrowDown: DIRS.down, s: DIRS.down,
  ArrowLeft: DIRS.left, a: DIRS.left, ArrowRight: DIRS.right, d: DIRS.right,
};

function turn(d) {
  // Don't allow reversing straight into yourself
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
}

document.addEventListener('keydown', e => {
  if (e.key === ' ') { if (over) reset(); e.preventDefault(); return; }
  const d = KEYS[e.key];
  if (!d) return;
  e.preventDefault();
  turn(d);
});

// On-screen buttons
document.querySelectorAll('#pad button[data-dir]').forEach(btn => {
  btn.addEventListener('pointerdown', e => { e.preventDefault(); turn(DIRS[btn.dataset.dir]); });
});
document.getElementById('restart').addEventListener('pointerdown', e => { e.preventDefault(); reset(); });

// Swipe on the canvas; tap restarts when game over
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchStart = {x: t.clientX, y: t.clientY};
}, {passive: false});
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { if (over) reset(); return; }
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.right : DIRS.left)
                                    : (dy > 0 ? DIRS.down : DIRS.up));
}, {passive: false});
canvas.addEventListener('click', () => { if (over) reset(); });

// Tilt control (device orientation). Enabling it calibrates to the current hold angle.
const tiltBtn = document.getElementById('tilt');
const TILT_THRESHOLD = 12; // degrees away from the calibrated position before turning
let tiltOn = false, base = null;

function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  if (!base) { base = {beta: e.beta, gamma: e.gamma}; return; }
  let x = e.gamma - base.gamma, y = e.beta - base.beta; // portrait: right = +x, top tipped away = -y
  const angle = (screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0;
  if (angle === 90 || angle === -270) [x, y] = [y, -x];
  else if (angle === 270 || angle === -90) [x, y] = [-y, x];
  else if (angle === 180) [x, y] = [-x, -y];
  if (Math.max(Math.abs(x), Math.abs(y)) < TILT_THRESHOLD) return;
  turn(Math.abs(x) > Math.abs(y) ? (x > 0 ? DIRS.right : DIRS.left)
                                 : (y > 0 ? DIRS.down : DIRS.up));
}

async function setTilt(on) {
  if (on) {
    if (typeof DeviceOrientationEvent === 'undefined') { alert('Tilt not supported on this device.'); return; }
    if (typeof DeviceOrientationEvent.requestPermission === 'function') { // iOS
      try {
        if (await DeviceOrientationEvent.requestPermission() !== 'granted') { alert('Motion access denied.'); return; }
      } catch (err) { alert('Motion access failed: ' + err.message); return; }
    }
    base = null;
    window.addEventListener('deviceorientation', onOrient);
  } else {
    window.removeEventListener('deviceorientation', onOrient);
  }
  tiltOn = on;
  tiltBtn.textContent = 'Tilt control: ' + (on ? 'On' : 'Off');
  tiltBtn.classList.toggle('on', on);
}
tiltBtn.addEventListener('click', () => setTilt(!tiltOn));

reset();
setInterval(() => { step(); draw(); }, 120);
</script>
</body>
</html>
